# Installed by config/host/apply_host_config.sh.
# Keep logs across reboots (needed to debug stations), but capped, and
# flushed to the SD card less often. Messages at CRIT and above are still
# written immediately.
#
# 200M, not less: after every hard power cut journald leaves the dirty
# file behind and starts a new one with 8 MB reserved (fallocate, not
# written, so no wear). With a small cap a few cuts in a row vacuum away
# the logs from exactly the boots you want to investigate.
[Journal]
Storage=persistent
SystemMaxUse=200M
SyncIntervalSec=10m
MaxLevelStore=info
